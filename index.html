<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Membuka Instagram...</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #F4F5F7; color: #101828;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0D0F14; color: #E6E8EC; }
    .card { background: #161A22 !important; border-color: #232936 !important; }
    a.btn.sec { color: #E6E8EC !important; border-color: #333B4A !important; }
  }
  .card {
    background: #fff; border: 1px solid #E4E7EC; border-radius: 18px;
    padding: 32px 24px; max-width: 360px; width: 100%;
    box-shadow: 0 10px 40px rgba(16,24,40,.08);
  }
  .logo {
    width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 16px;
    background: linear-gradient(45deg,#f9ce34,#ee2a7b 45%,#6228d7);
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 34px; height: 34px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { font-size: 14px; color: #667085; margin: 0 0 22px; }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 20px;
    border: 3px solid #E4E7EC; border-top-color: #ee2a7b;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.btn {
    display: block; text-decoration: none; font-weight: 600; font-size: 15px;
    padding: 13px; border-radius: 12px; margin-top: 10px;
  }
  a.btn.pri { background: #ee2a7b; color: #fff; }
  a.btn.sec { border: 1px solid #E4E7EC; color: #101828; }
  .handle { font-weight: 600; color: #101828; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="#fff"/>
      </svg>
    </div>
    <div class="spinner" id="spin"></div>
    <h1>Membuka Instagram</h1>
    <p>Mengarahkan ke <span class="handle" id="who">profil</span>...</p>
    <div id="manual" hidden>
      <a class="btn pri" id="openApp" href="#">Buka di aplikasi Instagram</a>
      <a class="btn sec" id="openWeb" href="#" target="_blank" rel="noopener">Buka di browser</a>
    </div>
  </div>

<script>
(function () {
  // Ambil username dari ?u=... , ?username=... , atau path terakhir (/ig/USERNAME)
  var params = new URLSearchParams(location.search);
  var user = params.get("u") || params.get("username") || "";
  if (!user) {
    var seg = location.pathname.split("/").filter(Boolean);
    if (seg.length) user = seg[seg.length - 1].replace(/\.html?$/i, "");
  }
  user = (user || "").trim().replace(/^@/, "");

  var PKG = "com.instagram.android";
  var webURL = user
    ? "https://www.instagram.com/" + encodeURIComponent(user) + "/"
    : "https://www.instagram.com/";

  document.getElementById("who").textContent = user ? "@" + user : "Instagram";
  document.getElementById("openWeb").href = webURL;

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  // Deeplink Android: buka aplikasi ke profil, fallback ke Play Store
  var androidIntent =
    "intent://instagram.com/_u/" + encodeURIComponent(user) +
    "#Intent;package=" + PKG + ";scheme=https;" +
    "S.browser_fallback_url=" +
    encodeURIComponent("https://play.google.com/store/apps/details?id=" + PKG) +
    ";end";

  // Deeplink skema-app (dipakai iOS untuk membuka aplikasi langsung)
  var appScheme = "instagram://user?username=" + encodeURIComponent(user);

  function showManual() {
    document.getElementById("spin").hidden = true;
    var m = document.getElementById("manual");
    m.hidden = false;
    document.getElementById("openApp").href =
      isAndroid ? androidIntent : (isIOS ? appScheme : webURL);
  }

  function go() {
    if (isAndroid) {
      // Android: intent:// menangani app + fallback Play Store secara otomatis
      location.href = androidIntent;
      setTimeout(showManual, 1200);
    } else if (isIOS) {
      // iOS: universal link membuka aplikasi bila terpasang;
      // bila tidak, Safari tetap di halaman profil. Sediakan tombol manual juga.
      location.href = webURL;
      setTimeout(showManual, 1200);
    } else {
      location.replace(webURL);
    }
  }

  if (!user) { showManual(); }
  else { go(); }
})();
</script>
</body>
</html>
